services:
  supertonic:
    build:
      context: .
    ports:
      - "7788:7788"
    restart: unless-stopped

    # Giới hạn tài nguyên tránh server bị ăn hết RAM/CPU
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    # Healthcheck để Docker biết container có thực sự ready không
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7788/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    # Log không phình to vô tội vạ
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tts-gateway:
    build:
      context: ./tts-gateway
    environment:
      # gọi nội bộ trong compose network
      TTS_URL: "http://supertonic:7788/v1/tts"
      # URL public để backend tải file (đổi theo domain thực tế)
      BASE_PUBLIC_URL: "http://127.0.0.1:7799"
      OUTPUT_DIR: "/data/out"
      CALLBACK_TIMEOUT_SEC: "10"
      # Giới hạn số job generate chạy song song
      MAX_CONCURRENCY: "5"
      # Queue tối đa bao nhiêu job đang chờ
      QUEUE_MAXSIZE: "500"
    ports:
      - "7799:7799"
    volumes:
      - tts_outputs:/data/out
    depends_on:
      supertonic:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tts_outputs: